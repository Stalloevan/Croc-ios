name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Resolve Go dependencies
        working-directory: go
        run: |
          go get github.com/schollz/croc/v11@latest
          go mod tidy

      # Real transfers through a local relay: app -> app, and relay selection.
      - name: Wrapper tests
        working-directory: go
        shell: bash
        run: |
          if ! go test ./crocmobile -run 'TestLoopback|TestRelayMapping|TestDeclinedMapping|TestSecureChannelRetry' -v -timeout 240s > "$RUNNER_TEMP/wrapper.log" 2>&1; then
            msg=$(tail -n 60 "$RUNNER_TEMP/wrapper.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Wrapper tests failed::${msg}"
            exit 1
          fi
          msg=$(tail -n 12 "$RUNNER_TEMP/wrapper.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Wrapper tests passed::${msg}"

      # App <-> the real croc CLI, both directions. Informational: reports, never blocks.
      - name: Cross-client tests (croc CLI)
        continue-on-error: true
        working-directory: go
        shell: bash
        run: |
          go install github.com/schollz/croc/v11@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          if ! go test ./crocmobile -run 'TestCLI' -v -timeout 300s > "$RUNNER_TEMP/cli.log" 2>&1; then
            msg=$(tail -n 70 "$RUNNER_TEMP/cli.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Cross-client tests failed::${msg}"
            exit 1
          fi
          msg=$(grep -E '^(---|ok|PASS|FAIL)' "$RUNNER_TEMP/cli.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Cross-client tests passed::${msg}"

  # Builds the unsigned IPA. Runs in parallel with `test`; only the release waits for both.
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Version is YY.MMDD.N (US Eastern date); N counts releases made that day.
      - name: Compute version
        id: ver
        shell: bash
        run: |
          prefix=$(TZ=America/New_York date +%y.%m%d)
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/${prefix}.${n}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          echo "version=${prefix}.${n}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${prefix}.${n}"

      - name: Stamp app version
        shell: bash
        run: |
          sed -i '' "s/CFBundleShortVersionString: \"0.1.0\"/CFBundleShortVersionString: \"${{ steps.ver.outputs.version }}\"/" project.yml
          sed -i '' "s/CFBundleVersion: \"1\"/CFBundleVersion: \"${{ github.run_number }}\"/" project.yml
          grep -n "Version" project.yml

      # The Go framework is the slow part (~4 min), and most pushes only change Swift.
      # Rebuild it only when the Go wrapper, its build script or croc itself changed.
      - name: Find latest croc release
        id: croc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(gh api repos/schollz/croc/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Cache Croc.xcframework
        id: fw
        uses: actions/cache@v4
        with:
          path: Frameworks/Croc.xcframework
          key: xcframework-v2-${{ steps.croc.outputs.version }}-${{ hashFiles('go/crocmobile/crocmobile.go', 'go/go.mod', 'scripts/build-croc-framework.sh') }}

      - uses: actions/setup-go@v5
        if: steps.fw.outputs.cache-hit != 'true'
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Build Croc.xcframework
        if: steps.fw.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
          CROC_VERSION: ${{ steps.croc.outputs.version }}
          TARGETS: ios   # the IPA only needs the device slice
        shell: bash
        run: |
          mkdir -p build
          if ! ./scripts/build-croc-framework.sh > build/framework.log 2>&1; then
            msg=$(tail -n 40 build/framework.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=framework build failed::${msg}"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project CrocApp.xcodeproj \
            -scheme CrocApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CrocApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/xcodebuild.log 2>&1 || {
            msg=$(grep -E "error:|\*\* ARCHIVE FAILED" build/xcodebuild.log | head -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xcodebuild failed::${msg}"
            exit 1
          }

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/CrocApp.xcarchive/Products/Applications/*.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Croc-unsigned.ipa Payload)
          ls -lh build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Croc-unsigned-ipa
          path: build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/*.log

  # Publishes the IPA once both the build and the transfer tests have passed.
  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Croc-unsigned-ipa

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp Croc-unsigned.ipa "Croc-${VERSION}-unsigned.ipa"
          gh release create "${VERSION}" "Croc-${VERSION}-unsigned.ipa" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
