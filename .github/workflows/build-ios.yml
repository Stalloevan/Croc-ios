name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Build Croc.xcframework
        env:
          GOTOOLCHAIN: auto
        shell: bash
        run: |
          mkdir -p build
          if ! ./scripts/build-croc-framework.sh > build/framework.log 2>&1; then
            msg=$(tail -n 40 build/framework.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=framework build failed::${msg}"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project CrocApp.xcodeproj \
            -scheme CrocApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CrocApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1 || {
            msg=$(grep -E "error:|\*\* ARCHIVE FAILED" build/xcodebuild.log | head -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xcodebuild failed::${msg}"
            exit 1
          }
        shell: bash

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/CrocApp.xcarchive/Products/Applications/*.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Croc-unsigned.ipa Payload)
          ls -lh build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Croc-unsigned-ipa
          path: build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/xcodebuild.log
