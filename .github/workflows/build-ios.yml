name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Build Croc.xcframework
        env:
          GOTOOLCHAIN: auto
        run: ./scripts/build-croc-framework.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project CrocApp.xcodeproj \
            -scheme CrocApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CrocApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | tail -n 50
        shell: bash

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/CrocApp.xcarchive/Products/Applications/*.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Croc-unsigned.ipa Payload)
          ls -lh build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Croc-unsigned-ipa
          path: build/Croc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/xcodebuild.log
